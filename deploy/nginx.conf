# N1 Proativo - proxy HTTPS
#
# Esta API convive com a API OCR na mesma VM: ela escuta em 127.0.0.1:8001 (a OCR usa 8000)
# e responde por um subdomínio próprio. Copie para /etc/nginx/conf.d/n1-proativo.conf
# e rode `sudo certbot --nginx -d n1.seudominio.com.br` para emitir o certificado.

limit_req_zone $binary_remote_addr zone=n1_geral:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=n1_login:10m rate=5r/m;

server {
    listen 80;
    server_name n1.seudominio.com.br;
    # o certbot substitui este bloco por um redirecionamento para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name n1.seudominio.com.br;

    # preenchidos pelo certbot
    # ssl_certificate     /etc/letsencrypt/live/n1.seudominio.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/n1.seudominio.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 1M;          # a API só recebe texto de chamado
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # o login é o alvo natural de força bruta; a API já bloqueia por IP, isto é a primeira barreira
    location /auth/login {
        limit_req zone=n1_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=n1_geral burst=20 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a chamada ao modelo pode levar dezenas de segundos
        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
    }
}
